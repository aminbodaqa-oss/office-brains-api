name: Platform Code Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "office/frontend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "office/frontend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run platform billing tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate platform admin JavaScript
        run: node --check office/frontend/js/platform-admin.js
