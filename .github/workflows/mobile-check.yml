name: Native Android app checks
on:
  push:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/mobile-check.yml"
permissions:
  contents: write
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install --no-audit --no-fund
      - name: Commit generated npm lockfile
        working-directory: .
        run: |
          if [ -f mobile/package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "Add mobile npm lockfile"
              git push
            fi
          else
            echo "npm did not generate mobile/package-lock.json"
            exit 1
          fi
      - run: npx tsc --noEmit
      - name: Check Expo SDK dependency compatibility
        run: npx expo install --check
      - name: Check backend Python syntax
        run: python -m compileall -q ../backend
