name: Native Android app checks
on:
  push:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/**"
      - ".github/workflows/mobile-check.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Check backend Python syntax
        run: python -m compileall -q ../backend
