name: Validate Office Brains

on:
  push:
    branches:
      - main
      - feature/real-office-workflow
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check workspace JavaScript syntax
        run: node --check office/js/workspace.js
