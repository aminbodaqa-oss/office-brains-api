<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب Vindora الافتراضي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--mut:#6b675c;--line:#e4e0d5;--acc:#1f6f5c;--accink:#fff;--me:#e6f2ee;--bot:#f0ede4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--card:#1f1d17;--ink:#f1eee4;--mut:#a29d8d;--line:#35322a;--acc:#4fb89c;--accink:#0d1f1a;--me:#1d3a31;--bot:#2a2820;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{padding:18px 16px 6px}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.logout{float:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
#authGate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#authGate.hidden{display:none}
.auth-card{width:min(100%,390px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 60px #0002}
.auth-card h2{margin:0 0 6px;font-size:22px}.auth-card p{margin:0 0 18px;color:var(--mut);font-size:14px}
.auth-card label{display:block;font-size:13px;margin:12px 0 5px}.auth-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink)}
.auth-card button{width:100%;border:0;border-radius:12px;padding:12px;margin-top:16px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;cursor:pointer}
#authError{color:#c0392b;font-size:13px;min-height:20px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 16px 28px;max-width:760px;margin:0 auto}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.desk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.desk:active{transform:scale(.97)}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:30px}
.desk b{display:block;font-size:16px}
.desk span{font-size:12px;color:var(--mut)}
.gm{grid-column:1/-1;border-color:var(--acc)}
.av{overflow:hidden}.av svg{width:100%;height:100%;display:block}
#chat,#meet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#chat.on,#meet.on{display:flex}
#mmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.top .av{width:40px;height:40px;font-size:22px;margin:0}
.top button{background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer}
.top small{display:block;color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.m.u{align-self:flex-start;background:var(--me)}
.m.b{align-self:flex-end;background:var(--bot)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);max-height:120px}
.send{background:var(--acc);color:var(--accink);border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
.send:disabled{opacity:.5}
.note{text-align:center;color:var(--mut);font-size:12px;padding:6px 14px}
</style>
</head>
<body>
<div id="authGate"><form class="auth-card" id="loginForm"><h2>تسجيل الدخول</h2><p>مساحة خاصة بصاحب الحساب فقط</p><label for="ownerUsername">اسم المستخدم</label><input id="ownerUsername" name="username" autocomplete="username" required><label for="ownerPassword">كلمة المرور</label><input id="ownerPassword" name="password" type="password" autocomplete="current-password" required><button id="loginSubmit" type="submit">دخول آمن</button><div id="authError" role="alert"></div></form></div>
<header><button class="logout" id="logoutBtn" type="button">تسجيل الخروج</button><h1>🏢 مكتب Vindora الافتراضي</h1><p>اضغط على أي موظف وابدأ كلمه</p></header>
<div class="grid" id="grid"></div>
<div id="meet"><div class="top"><button id="mback" aria-label="رجوع">→</button><div class="av" style="background:#1f6f5c33">🪑</div><div><b>غرفة الاجتماعات</b><small>اختار الحاضرين واكتب موضوع الاجتماع</small></div></div><div class="chips" id="mchips" style="padding-top:8px"></div><div id="mmsgs"></div><div class="chips" id="mact"><button type="button" id="mmin">📝 محضر الاجتماع</button><button type="button" id="mclr">🧹 اجتماع جديد</button></div><form id="mf"><textarea id="mt" rows="1" placeholder="اكتب موضوع الاجتماع أو سؤالك للفريق..."></textarea><button class="send" id="ms">إرسال</button></form></div>
<div id="chat">
  <div class="top"><button id="back" aria-label="رجوع">→</button><div class="av" id="cav"></div><div><b id="cname"></b><small id="crole"></small></div></div>
  <div id="msgs"></div>
  <div class="chips" id="chips"></div>
  <form id="f"><textarea id="t" rows="1" placeholder="اكتب رسالتك..."></textarea><button class="send" id="s">إرسال</button></form>
</div>
<script src="js/config.js"></script>
<script>
let ownerToken = null;
const authGate = document.getElementById("authGate");
const loginForm = document.getElementById("loginForm");
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("loginSubmit");
  const error = document.getElementById("authError");
  button.disabled = true; button.textContent = "جارٍ التحقق..."; error.textContent = "";
  try {
    const response = await fetch((window.OFFICE_API_URL || "").replace(/\\/$/, "") + "/api/auth/login", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username:document.getElementById("ownerUsername").value.trim(), password:document.getElementById("ownerPassword").value})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.access_token) throw new Error(data.detail || "تعذر تسجيل الدخول.");
    ownerToken = data.access_token; authGate.classList.add("hidden");
    document.getElementById("ownerPassword").value = "";
  } catch (err) { error.textContent = err.message || "تعذر الاتصال بالسيرفر."; }
  finally { button.disabled = false; button.textContent = "دخول آمن"; }
});
document.getElementById("logoutBtn").addEventListener("click", () => {
  ownerToken = null; authGate.classList.remove("hidden");
  document.getElementById("ownerPassword").value = "";
});
const CTX="الشركة: Vindora، منصة مصرية بتجمع منتجات الموردين بالمسوّقين (دروب شيبينج/أفلييت). المسوّق بيروّج للمنتجات برابط تتبع وبياخد عمولة ثابتة 40 جنيه على كل طلب ناجح، والمورّد بيعرض منتجاته ويحدد سعر الجملة ويدفع عند البيع بس. السحب من 250 جنيه (فودافون كاش/إنستاباي/محافظ). التفعيل خلال 24-48 ساعة. الشحن وخدمة العملاء علينا. الموقع vindora.whf.bz. ";
const RULES="قواعد التمثيل: انت موظف حقيقي في المكتب وليك شخصية وخبرة وأسلوب (واتساب). اتكلم بالعامية المصرية الطبيعية، رسايل قصيرة (1-3 جمل) وافصل بين كل رسالة والتانية بسطر فاضي، وممكن تبعت 2-3 رسايل ورا بعض. ما تكتبش مقالات ولا عناوين ولا تنسيق ماركداون. عندك رأي: لو الفكرة ضعيفة اعترض بأدب واشرح السبب، ولو ناقصك معلومة اسأل سؤال واحد بس. لو الموضوع مش تخصصك رشّح زميل بالاسم. ما تخترعش أرقام أو بيانات مش معاك. المستخدم هو صاحب الشركة (الريّس). لو سألك بجدية إنت إنسان ولا ذكاء اصطناعي، قول الحقيقة: إنك موظف افتراضي بالذكاء الاصطناعي. ";
const PERS={"ابراهيم":"٤٥ سنة، خبرة ٢٠ سنة في التجارة. هادي وحازم، بيحب الأرقام قبل القرارات، وبيقول 'خلّينا نمشي بالترتيب'.","ليلى":"٣٣ سنة، دافية ومنظمة، بتهتم بالناس قبل الورق، وبتقول 'بصراحة كده'.","نور":"٢٨ سنة، حماسية وبتشرح بأمثلة بسيطة، وبتقول 'تعالى نجرّب'.","كريم":"٣٠ سنة، عملي وسريع، شايف كل حاجة أرقام. بيقول 'نختبر الأول وبعدين نكبّر' وبيعترض على أي ميزانية كبيرة قبل الاختبار.","اسلام":"٣٥ سنة، تحليلي، أول سؤاله دايمًا 'مين العميل؟'، وبيرفض المنتجات اللي هامشها ضعيف.","طلعت":"٢٩ سنة، مرِح وخفيف الدم، بيحب الجمل القصيرة، وبيتضايق لو حد غيّر كلامه من غير سبب.","محمد":"٥٠ سنة، دقيق وحذر وقليل الكلام، بيقول 'الورق الأول'، ومتحفظ جدًا في المصاريف.","ثابت":"٣٢ سنة، هادي، بيقول 'الأرقام مش بتكدب بس لازم نسألها صح'، وبيطلب بيانات قبل ما يدّي رأي.","تهامي":"٢٧ سنة، فنان وبيسهر، بيستخدم مصطلحات مونتاج، وبيقول 'خلّينا نحسّها'.","سلمى":"٣١ سنة، سريعة ومرتبة جدًا، بتقول 'تمام حاضر' وبتأكد على كل ميعاد بالتاريخ والساعة.","عمرو":"٤٠ سنة، صبور ومفاوض، بيقول 'خلّينا نتفق على الشروط قبل أول أوردر'.","هدى":"٣٤ سنة، نشيطة ومتحمسة، بتقول 'الناس بتتحفز بالنتايج'، وبتتابع كل مسوّق باسمه.","ياسر":"٣٨ سنة، هادي وصبور جدًا، بيقول 'العميل ليه حق لحد ما نتأكد'، وبيهتم بالتفاصيل."};
const T=[
{n:"ابراهيم",r:"General Manager",e:"👔",c:"#c9a227",gm:1,q:["إيه أولوياتنا الأسبوع ده؟","وزّع شغل على الفريق"],p:"انت إبراهيم، المدير العام. بتفكر استراتيجيًا، بتحدد الأولويات، وبتوزع المهام على الفريق: ليلى (HR)، نور (مدربة)، كريم (ميديا باير)، إسلام (منتجات)، طلعت (كوبي رايتر)، محمد (محاسب)، ثابت (داتا)، تهامي (مونتاج)، سلمى (السكرتيرة)، عمرو (مدير الموردين)، هدى (مديرة المسوّقين)، ياسر (مدير خدمة العملاء). لما صاحب الشركة يطلب حاجة، قسّمها لمهام وقول مين يعملها وبأي ترتيب."},
{n:"ليلى",r:"HR Manager",e:"👩‍💼",c:"#d98fb0",q:["اكتب إعلان وظيفة","عايز سياسة للإجازات"],p:"انتي ليلى، مديرة الموارد البشرية. بتساعدي في التوظيف وإعلانات الوظايف وأسئلة المقابلات والعقود البسيطة وسياسات العمل والتقييم، وفقًا لقانون العمل المصري بشكل عام. نبّهي إن أي حاجة قانونية لازم تتراجع من محامي."},

let cur=null,busy=false;
const $=id=>document.getElementById(id);
const AV=[{s:'#d9a47a',h:'#8a8a8a',st:'short',b:1,o:'#2b3a55',t:'#8b1e2d'},{s:'#e0b48f',h:'#8a4f7d',st:'hijab',o:'#6b4a63'},{s:'#e0b48f',h:'#3a2417',st:'long',o:'#3f8fb0'},{s:'#c68c62',h:'#1d1510',st:'short',b:1,o:'#e07b4f'},{s:'#d9a47a',h:'#2a1c14',st:'short',g:1,o:'#5b4fb0',t:'#222'},{s:'#d9a47a',h:'#1d1510',st:'curly',o:'#3f8f5a'},{s:'#b97a56',h:'#8a8a8a',st:'short',g:1,b:1,o:'#3a3a44',t:'#555'},{s:'#c68c62',h:'#1d1510',st:'short',g:1,o:'#3f6f8f'},{s:'#b97a56',h:'#1d1510',st:'curly',b:1,o:'#b03a3a'},{s:'#d9a47a',h:'#2e6f6a',st:'hijab',o:'#c76fb3'},{s:'#c68c62',h:'#2a1c14',st:'short',b:1,o:'#4a5a6a',t:'#1d6f5c'},{s:'#e0b48f',h:'#6a4a2e',st:'hijab',o:'#d9a24f'},{s:'#b97a56',h:'#1d1510',st:'short',o:'#3b6fb0'}];
function avSVG(i){const a=AV[i],c=T[i].c,hj=a.st==='hijab';let s='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="'+c+'" opacity=".28"/><path d="M10 100Q12 72 50 70Q88 72 90 100Z" fill="'+a.o+'"/>';
if(a.t)s+='<path d="M40 71L50 85L60 71Z" fill="#fff"/><path d="M50 74L46 100L54 100Z" fill="'+a.t+'"/>';
if(hj)s+='<path d="M20 58Q18 14 50 14Q82 14 80 58Q80 88 50 92Q20 88 20 58Z" fill="'+a.h+'"/>';
if(a.st==='long')s+='<path d="M25 50Q22 14 50 14Q78 14 75 50L78 84L22 84Z" fill="'+a.h+'"/>';
s+='<rect x="43" y="58" width="14" height="16" rx="4" fill="'+a.s+'"/><ellipse cx="50" cy="46" rx="17" ry="21" fill="'+a.s+'"/>';
if(a.b)s+='<path d="M33 50Q33 72 50 72Q67 72 67 50Q59 62 50 62Q41 62 33 50Z" fill="'+a.h+'"/>';
if(a.st==='short'||a.st==='long')s+='<path d="M31 42Q30 19 50 19Q70 19 69 42Q62 29 50 29Q38 29 31 42Z" fill="'+a.h+'"/>';
if(a.st==='curly')for(const p of [[34,28],[44,22],[56,22],[66,28],[32,38],[68,38]])s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="'+a.h+'"/>';
if(hj)s+='<path d="M33 40Q50 22 67 40Q67 30 50 26Q33 30 33 40Z" fill="'+a.h+'"/>';
s+='<circle cx="43" cy="46" r="1.8" fill="#222"/><circle cx="57" cy="46" r="1.8" fill="#222"/><path d="M38 41Q43 39 47 41M53 41Q57 39 62 41" stroke="#222" stroke-width="1.5" fill="none"/><path d="M44 57Q50 61 56 57" stroke="#7a3b2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
if(a.g)s+='<g fill="none" stroke="#222" stroke-width="1.5"><circle cx="43" cy="46" r="6"/><circle cx="57" cy="46" r="6"/><path d="M49 46h2"/></g>';
return s+'</svg>'}
$("grid").innerHTML=T.map((x,i)=>`<button class="desk ${x.gm?"gm":""}" data-i="${i}"><div class="av">${avSVG(i)}</div><b>${x.n}</b><span>${x.r}</span></button>`).join("");
$("grid").onclick=e=>{const b=e.target.closest(".desk");if(b)openChat(+b.dataset.i)};
$("back").onclick=()=>{$("chat").classList.remove("on");cur=null};
function openChat(i){
  cur=i;const x=T[i];hist[i]=hist[i]||[];
  $("cav").innerHTML=avSVG(i);$("cname").textContent=x.n;$("crole").textContent=x.r;
  $("chips").innerHTML=x.q.map(q=>`<button type="button">${q}</button>`).join("");
  $("chat").classList.add("on");draw();
}
$("chips").onclick=e=>{if(e.target.tagName==="BUTTON"){$("t").value=e.target.textContent;send()}};
function draw(){
  const h=hist[cur],x=T[cur],box=$("msgs");box.textContent="";
  if(!h.length){const d=document.createElement("div");d.className="note";d.textContent="أهلاً! أنا "+x.n+"، "+x.r+". اتفضل كلمني.";box.append(d)}
  h.forEach(m=>{
    if(m.role==="user"){const d=document.createElement("div");d.className="m u";d.textContent=m.content;box.append(d);return}
    const parts=m.content==="..."?["بيكتب…"]:m.content.split(/\n\s*\n/).filter(s=>s.trim());
    parts.forEach(s=>{const d=document.createElement("div");d.className="m b";d.textContent=s.trim();if(m.content==="...")d.style.opacity=.6;box.append(d)})
  });
  $("chips").style.display=h.length?"none":"flex";
  box.scrollTop=1e9;
}
function drawOld(){
  const h=hist[cur],x=T[cur];
  $("msgs").innerHTML=(h.length?"":`<div class="note">أهلاً! أنا ${x.n}، ${x.r}. اتفضل كلمني.</div>`)+h.map(m=>`<div class="m ${m.role==="user"?"u":"b"}"></div>`).join("");
  [...$("msgs").children].slice(h.length?0:1).forEach((el,i)=>el.textContent=h[i].content);
  $("chips").style.display=h.length?"none":"flex";
  $("msgs").scrollTop=1e9;
}
async function apiRequest(path,body){
 const base=(window.OFFICE_API_URL||"").replace(/\/$/,"");
 if(!base)throw new Error("api_not_configured");
 if(!ownerToken)throw new Error("سجّل الدخول أولًا.");
 const headers={"Content-Type":"application/json","Authorization":"Bearer "+ownerToken};
 const response=await fetch(base+path,{method:"POST",headers,body:JSON.stringify(body)});
 const data=await response.json().catch(()=>({}));
 if(response.status===401){ownerToken=null;authGate.classList.remove("hidden");}
 if(!response.ok)throw new Error(data.detail||("HTTP "+response.status));
 return data;
}
$("f").onsubmit=e=>{e.preventDefault();send()};
$("t").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
async function send(){
 const txt=$("t").value.trim();if(!txt||busy||cur===null)return;
 const i=cur,x=T[i],h=hist[i];$("t").value="";
 h.push({role:"user",content:txt});const bot={role:"assistant",content:"..."};h.push(bot);draw();
 busy=true;$("s").disabled=true;
 try{
  const messages=h.slice(0,-1).filter(m=>m.content&&m.content!=="...").slice(-24).map(m=>({role:m.role,content:m.content}));
  while(messages.length&&messages[0].role!=="user")messages.shift();
  const now=new Date().toLocaleString("ar-EG",{dateStyle:"full",timeStyle:"short",timeZone:"Africa/Cairo"});
  const context="[تعليمات: "+x.p+" الشخصية: "+PERS[x.n]+" "+CTX+RULES+" الوقت في القاهرة: "+now+"]";
  const result=await apiRequest("/api/chat",{employee_id:x.n,role:x.r,employee_prompt:context,messages});
  bot.content=result.content||"وصل رد فارغ من السيرفر.";
}catch(err){
  bot.content=err&&err.message==="api_not_configured"?"رابط السيرفر لسه مش متحدد في js/config.js.":(err&&err.message?err.message:"حصلت مشكلة في الاتصال بالسيرفر.");
 }finally{busy=false;$("s").disabled=false;if(bot.content==="...")bot.content="معلش، حصلت مشكلة. ابعتلي تاني.";saveH();if(cur===i)draw()}
}
$('grid').insertAdjacentHTML('afterbegin','<button class="desk gm" id="meetBtn"><div class="av" style="background:#1f6f5c33">🪑</div><b>غرفة الاجتماعات</b><span>اجمع الفريق في نقاش واحد</span></button>');
let mh=[];try{mh=JSON.parse(localStorage.getItem('vo_meet')||'[]')}catch(e){}
const mOn=new Set(['ابراهيم','كريم','اسلام','طلعت']);
const saveM=()=>{try{localStorage.setItem('vo_meet',JSON.stringify(mh.slice(-60)))}catch(e){}};
function mchips(){$('mchips').textContent='';T.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.e+' '+x.n;b.className=mOn.has(x.n)?'on':'';b.onclick=()=>{mOn.has(x.n)?mOn.delete(x.n):mOn.add(x.n);b.className=mOn.has(x.n)?'on':''};$('mchips').append(b)})}
function mdraw(){const box=$('mmsgs');box.textContent='';if(!mh.length){const d=document.createElement('div');d.className='note';d.textContent='اختار الحاضرين فوق، واكتب موضوع الاجتماع. كل واحد هيرد بالدور ويعلّق على زمايله.';box.append(d)}
mh.forEach(m=>{const d=document.createElement('div');d.className='m '+(m.u?'u':'b');if(!m.u){const w=document.createElement('b');w.textContent=m.e+' '+m.w;w.style.display='block';w.style.fontSize='12px';d.append(w)}d.append(document.createTextNode(m.c==='...'?'بيكتب…':m.c));box.append(d)});box.scrollTop=1e9}
$('meetBtn').onclick=()=>{$('meet').classList.add('on');mchips();mdraw()};
$('mback').onclick=()=>$('meet').classList.remove('on');
$('mclr').onclick=()=>{if(busy)return;mh=[];saveM();mdraw()};
async function speak(x,instr,bot){
 const now=new Date().toLocaleString("ar-EG",{dateStyle:"full",timeStyle:"short",timeZone:"Africa/Cairo"});
 const tr=mh.filter(m=>m!==bot&&m.c!=="...").slice(-30).map(m=>(m.u?"الريّس":m.w)+": "+m.c).join("\n");
 const result=await apiRequest("/api/meeting/respond",{employee_id:x.n,role:x.r,employee_prompt:x.p,personality:PERS[x.n],company_context:CTX,rules:RULES,time:now,transcript:tr,instruction:instr});
 bot.c=(result.content||"وصل رد فارغ من السيرفر.").trim();return true;
}
async function mSend(){
 const txt=$('mt').value.trim();if(!txt||busy)return;
 const att=T.filter(x=>mOn.has(x.n));if(!att.length){$('mt').placeholder='اختار حاضر واحد على الأقل';return}
 $('mt').value='';mh.push({u:1,c:txt});busy=true;$('ms').disabled=true;
 let fine=true;try{for(const x of att){const bot={w:x.n,e:x.e,c:'...'};mh.push(bot);mdraw();
  const ok=await speak(x,'انت في اجتماع مع الريّس وزمايلك ('+att.map(a=>a.n).join('، ')+'). دورك: ردّ على آخر كلام الريّس وعلى اللي اتكلموا قبلك من زاوية تخصصك ('+x.r+') في رسالة واحدة (1-3 جمل). علّق على زميل بالاسم لو في داعي: اتفق أو اعترض. ما تكررش اللي اتقال. اكتب كلامك بس بدون اسمك.',bot);if(!ok){fine=false;break}}
  if(fine&&att.length>1){const g=T[0],b2={w:g.n+' · القرار',e:g.e,c:'...'};mh.push(b2);mdraw();await speak(g,'انت المدير العام وبتختم الاجتماع دلوقتي. لخّص في رسالة واحدة (2-4 جمل): القرار النهائي، ومين هيعمل إيه، وأول خطوة. اعتمد على اللي اتقال بس وما تضيفش أرقام من عندك.',b2)}}
 catch(err){const l=mh[mh.length-1];if(l&&l.c==='...')l.c=err&&err.code==='rate_limited'?'استنى شوية وجرّب تاني.':'حصلت مشكلة، جرّب تاني.'}
 finally{mh=mh.filter(m=>m.c!=='...');busy=false;$('ms').disabled=false;saveM();mdraw()}}
$('mmin').onclick=async()=>{if(busy||!mh.length)return;busy=true;const x=T.find(t=>t.n==='سلمى');const bot={w:x.n,e:x.e,c:'...'};mh.push(bot);mdraw();
 try{await speak(x,'اكتبي محضر الاجتماع: القرارات، المهام (مين/إيه/إمتى)، والنقاط المفتوحة. نص عادي بدون ماركداون، نقاط بشرطة، وكوني مختصرة.',bot)}catch(e){bot.c='حصلت مشكلة، جرّب تاني.'}
 finally{mh=mh.filter(m=>m.c!=='...');busy=false;saveM();mdraw()}};
$('mf').onsubmit=e=>{e.preventDefault();mSend()};
$('mt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();mSend()}};
</script>
